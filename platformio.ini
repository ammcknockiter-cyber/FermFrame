; FermFrame - standalone fermentation graph for the Geekmagic "Smart Weather Clock"
; (SmallTV / SmallTV-Ultra, ESP8266 + 240x240 ST7789 screen).
;
; Build:   pio run
; The image must stay under 507,904 bytes so a brand-new clock's own
; "update_ota" page accepts it (see installer/).

[env:geekmagic]
platform = espressif8266
board = esp12e
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
board_build.flash_mode = dio
board_build.f_cpu = 160000000L
monitor_speed = 115200
upload_speed = 460800

lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@7.2.1
  ricmoo/QRCode@0.0.1

build_flags =
  ; ---- Screen wiring used by the Geekmagic ESP8266 clocks ----
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=-1
  -D TFT_DC=0
  -D TFT_RST=2
  -D TFT_SPI_MODE=SPI_MODE3
  -D SPI_FREQUENCY=40000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT7=1
  ; big 72px digits for the "Big number" and "Clock" pages
  -D LOAD_FONT8N=1
  ; Modern / Classic / Typewriter font styles (FreeSans/Serif/Mono Bold)
  -D LOAD_GFXFF=1
  ; ---- Backlight: GPIO5, switched ON by driving it LOW (dimmable with PWM) ----
  -D BACKLIGHT_PIN=5
  -D BACKLIGHT_ON=LOW
  ; ---- Size ----
  -D BEARSSL_SSL_BASIC
  -D NDEBUG
  -D FERMFRAME_VERSION=\"2.4.0\"

; TEST ONLY - never install for real use or publish: shows the setup hotspot password in
; /fermframe.json and adds /test-setup, so setup mode can be tested without touching the device.
[env:geekmagic_test]
extends = env:geekmagic
build_flags = ${env:geekmagic.build_flags} -D FERMFRAME_TEST

; Setup-only firmware (Wi-Fi setup, /save, /update - no Brewfather/RAPT, no
; fermframe.local), small enough (< 507,904 bytes) for a brand-new clock's own
; update page. The installer sends this first, then the full one straight away.
[env:geekmagic_lite]
extends = env:geekmagic
build_flags = ${env:geekmagic.build_flags} -D FERMFRAME_LITE
